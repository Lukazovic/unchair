name: Release

# Push a tag like v0.2.0 to publish a release:
#   git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-26
    env:
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build DMG
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          scripts/make-dmg.sh "$version"

      - name: Sign update and update appcast
        if: env.SPARKLE_PRIVATE_KEY != ''
        run: |
          generate_appcast=$(scripts/sparkle-tool.sh generate_appcast build/DerivedData)
          mkdir -p build/appcast
          cp "build/Unchair-$VERSION.dmg" build/appcast/
          cp docs/appcast.xml build/appcast/appcast.xml
          echo "$SPARKLE_PRIVATE_KEY" | "$generate_appcast" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/" \
            --link "https://lukazovic.github.io/unchair/" \
            build/appcast
          cp build/appcast/appcast.xml "$RUNNER_TEMP/appcast.xml"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "build/Unchair-$VERSION.dmg" \
            --title "Unchair $VERSION" \
            --generate-notes \
            --prerelease

      - name: Publish appcast
        if: env.SPARKLE_PRIVATE_KEY != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          cp "$RUNNER_TEMP/appcast.xml" docs/appcast.xml
          git add docs/appcast.xml
          git commit -m "Update appcast for $VERSION"
          git push origin main
