name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install linters
        run: brew install swiftlint swiftformat
      - name: SwiftFormat
        run: swiftformat --lint .
      - name: SwiftLint
        run: swiftlint --strict

  core-tests:
    name: UnchairCore tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Run tests
        run: swift test --package-path Packages/UnchairCore

  build-app:
    name: Build app
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build
        run: |
          xcodebuild build \
            -project Unchair.xcodeproj \
            -scheme Unchair \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO
